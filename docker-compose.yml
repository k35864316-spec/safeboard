# MongoDB 를 Docker 로 한 번에 띄우기:  npm run db:up   (끄기: npm run db:down)
# 데이터는 'safeboard-mongo-data' 볼륨에 보관되어 컨테이너를 꺼도 유지됩니다.
services:
  mongo:
    image: mongo:7
    container_name: safeboard-mongo
    restart: unless-stopped
    # 내 컴퓨터(127.0.0.1)에서만 접속 가능하게 바인딩 (외부 네트워크에 DB 노출 방지)
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - safeboard-mongo-data:/data/db

volumes:
  safeboard-mongo-data:
